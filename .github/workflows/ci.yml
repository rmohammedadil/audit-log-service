name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This workflow reads source only and neither publishes artifacts nor deploys.
permissions:
  contents: read

jobs:
  regression:
    name: Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Configure disposable test environment
        run: |
          signing_key="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_key"
          echo "AUDIT_JWT_SIGNING_KEY=$signing_key" >> "$GITHUB_ENV"
          echo "AUDIT_JWT_ISSUER=audit-ci" >> "$GITHUB_ENV"
          echo "AUDIT_JWT_AUDIENCE=audit-ci-api" >> "$GITHUB_ENV"
          echo "AUDIT_V4_DB_PATH=${RUNNER_TEMP}/audit-ci-tests-v4.db" >> "$GITHUB_ENV"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run full regression suite
        run: python -m pytest -q -p no:cacheprovider --basetemp "${RUNNER_TEMP}/pytest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  dependency-security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned vulnerability scanner
        run: python -m pip install "pip-audit==2.10.1"
      - name: Scan declared dependencies
        run: python -m pip_audit --requirement requirements.txt --strict

  container-smoke:
    name: Docker runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and exercise the disposable container
        run: bash scripts/docker_smoke_test.sh
