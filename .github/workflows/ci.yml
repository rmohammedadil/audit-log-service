name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This workflow reads source, publishes validation evidence, and never deploys.
permissions:
  contents: read

jobs:
  regression:
    name: Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Configure disposable test environment
        run: |
          signing_key="$(openssl rand -hex 32)"
          echo "::add-mask::$signing_key"
          echo "AUDIT_JWT_SIGNING_KEY=$signing_key" >> "$GITHUB_ENV"
          echo "AUDIT_JWT_ISSUER=audit-ci" >> "$GITHUB_ENV"
          echo "AUDIT_JWT_AUDIENCE=audit-ci-api" >> "$GITHUB_ENV"
          echo "AUDIT_V4_DB_PATH=${RUNNER_TEMP}/audit-ci-tests-v4.db" >> "$GITHUB_ENV"
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run full regression suite
        id: pytest
        shell: bash
        run: |
          rm -rf .coverage-reports
          mkdir -p .coverage-reports
          set +e
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --basetemp "${RUNNER_TEMP}/pytest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>&1 | tee .coverage-reports/pytest.log
          exit_code="${PIPESTATUS[0]}"
          printf '%s\n' "$exit_code" > .coverage-reports/pytest.exitcode
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
      - name: Enforce independent coverage gates
        id: coverage_gate
        if: steps.pytest.outcome == 'success'
        shell: bash
        run: |
          set +e
          set -o pipefail
          python scripts/check_coverage.py .coverage-reports/coverage.json 2>&1 | tee .coverage-reports/coverage-gate.log
          exit_code="${PIPESTATUS[0]}"
          printf '%s\n' "$exit_code" > .coverage-reports/coverage-gate.exitcode
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
      - name: Record regression evidence manifest
        if: always()
        shell: bash
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
          COVERAGE_GATE_OUTCOME: ${{ steps.coverage_gate.outcome }}
          COVERAGE_GATE_EXIT_CODE: ${{ steps.coverage_gate.outputs.exit_code }}
        run: |
          mkdir -p .coverage-reports
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "git_ref=${GITHUB_REF}"
            echo "git_branch=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            echo "python_version=$(python --version 2>&1)"
            echo "test_command=python -m pytest -q -p no:cacheprovider --basetemp \${RUNNER_TEMP}/pytest-\${GITHUB_RUN_ID}-\${GITHUB_RUN_ATTEMPT}"
            echo "pytest_step_outcome=${PYTEST_OUTCOME:-not-run}"
            echo "pytest_exit_code=${PYTEST_EXIT_CODE:-not-recorded}"
            echo "coverage_gate_command=python scripts/check_coverage.py .coverage-reports/coverage.json"
            echo "coverage_gate_step_outcome=${COVERAGE_GATE_OUTCOME:-not-run}"
            echo "coverage_gate_exit_code=${COVERAGE_GATE_EXIT_CODE:-not-recorded}"
          } > .coverage-reports/evidence-manifest.txt
      - name: Upload regression coverage and test evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: regression-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .coverage-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  dependency-security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned vulnerability scanner
        run: python -m pip install "pip-audit==2.10.1"
      - name: Scan declared dependencies
        run: python -m pip_audit --requirement requirements.txt --strict

  container-smoke:
    name: Docker runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and exercise the disposable container
        run: bash scripts/docker_smoke_test.sh
